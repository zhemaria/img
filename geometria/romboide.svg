<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 245" width="300" height="245" role="img" aria-labelledby="t-romboide d-romboide">
<title id="t-romboide">Romboide</title>
<desc id="d-romboide">Paralelogramo sin angulos rectos. Los dos lados horizontales son iguales entre si, marcados con una raya, y los dos lados inclinados son iguales entre si, marcados con dos rayas. Los lados opuestos son paralelos.</desc>
<rect x="0" y="0" width="300" height="245" fill="#ffffff"/>
<path d="M20,190 H220 L270,70 H70 Z" fill="#dbe9f7" stroke="#14395e" stroke-width="3" stroke-linejoin="round"/><g fill="none" stroke="#a02218" stroke-width="3" stroke-linecap="round"><path d="M120,183 V197"/><path d="M170,63 V77"/></g><g fill="none" stroke="#a02218" stroke-width="3" stroke-linecap="round"><path d="M36.6,131.9 L49.6,137.3"/><path d="M40.4,122.7 L53.4,128.1"/><path d="M236.6,131.9 L249.6,137.3"/><path d="M240.4,122.7 L253.4,128.1"/></g>
<text x="150" y="220" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#14395e">Romboide</text>
</svg>
