<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 282" width="380" height="282" role="img" aria-labelledby="t-triangulo-rectangulo-paralelogramo d-triangulo-rectangulo-paralelogramo">
<title id="t-triangulo-rectangulo-paralelogramo">Figura compuesta: triangulo, rectangulo y paralelogramo</title>
<desc id="d-triangulo-rectangulo-paralelogramo">Figura formada por tres partes apiladas: un triangulo apoyado sobre el lado superior de un rectangulo, y un paralelogramo unido al lado inferior del rectangulo. Cada parte esta delineada por separado. El area total se obtiene sumando las tres areas.</desc>
<rect x="0" y="0" width="380" height="282" fill="#ffffff"/>
<path d="M95,110 L165,50 L235,110 Z" fill="#f6e0dc" stroke="#14395e" stroke-width="3" stroke-linejoin="round"/><path d="M95,110 H235 V190 H95 Z" fill="#dbe9f7" stroke="#14395e" stroke-width="3" stroke-linejoin="round"/><path d="M95,190 H235 L285,240 H145 Z" fill="#e4ecd9" stroke="#14395e" stroke-width="3" stroke-linejoin="round"/><text x="165" y="95" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#14395e">triángulo</text><text x="165" y="155" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#14395e">rectángulo</text><text x="192" y="222" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#14395e">paralelogramo</text>
<text x="190" y="266" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#14395e">Área total = suma de las tres partes</text>
</svg>
