<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 285" width="320" height="285" role="img" aria-labelledby="t-elementos-circunferencia d-elementos-circunferencia">
<title id="t-elementos-circunferencia">Elementos de la circunferencia</title>
<desc id="d-elementos-circunferencia">Circunferencia con su centro marcado por un punto. Desde el centro sale el radio hasta el borde. El diametro es el segmento que atraviesa la figura pasando por el centro y mide el doble del radio. Una cuerda une dos puntos del borde sin pasar por el centro. El arco es la porcion resaltada del borde entre dos puntos.</desc>
<rect x="0" y="0" width="320" height="285" fill="#ffffff"/>
<circle cx="150" cy="140" r="80" fill="#dbe9f7" stroke="#14395e" stroke-width="3"/><path d="M70,140 A80,80 0 0 1 110,70.7" fill="none" stroke="#a02218" stroke-width="7" stroke-linecap="round"/><g fill="none" stroke="#14395e" stroke-width="3" stroke-linecap="round"><path d="M70,140 H230"/><path d="M150,140 L195.9,74.5"/><path d="M103.4,205 H196.6"/></g><circle cx="150" cy="140" r="5" fill="#14395e"/><text x="150" y="132" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#14395e">diámetro</text><text x="203" y="66" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#14395e">radio</text><text x="142" y="158" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#14395e">centro</text><text x="204" y="211" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#14395e">cuerda</text><text x="58" y="78" text-anchor="end" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#a02218">arco</text>
<text x="160" y="268" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#14395e">Elementos de la circunferencia</text>
</svg>
