<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 250" width="430" height="250" role="img" aria-labelledby="t-suma-angulos-triangulo d-suma-angulos-triangulo">
<title id="t-suma-angulos-triangulo">La suma de los angulos de un triangulo es 180 grados</title>
<desc id="d-suma-angulos-triangulo">A la izquierda, un triangulo con sus tres angulos interiores nombrados A, B y C. A la derecha, esos mismos tres angulos colocados uno junto a otro sobre una linea recta: juntos completan exactamente un angulo llano. Por eso A mas B mas C es igual a 180 grados en cualquier triangulo.</desc>
<rect x="0" y="0" width="430" height="250" fill="#ffffff"/>
<path d="M115,45 L210,155 H20 Z" fill="#dbe9f7" stroke="#14395e" stroke-width="3" stroke-linejoin="round"/><text x="115" y="82" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#14395e">A</text><text x="182" y="143" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#14395e">B</text><text x="48" y="143" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#14395e">C</text><path d="M330,180 L255,180 A75,75 0 0 1 281.0,123.2 Z" fill="#e4ecd9" stroke="#14395e" stroke-width="2.5" stroke-linejoin="round"/><path d="M330,180 L281.0,123.2 A75,75 0 0 1 379.0,123.2 Z" fill="#dbe9f7" stroke="#14395e" stroke-width="2.5" stroke-linejoin="round"/><path d="M330,180 L379.0,123.2 A75,75 0 0 1 405,180 Z" fill="#f6e0dc" stroke="#14395e" stroke-width="2.5" stroke-linejoin="round"/><g fill="none" stroke="#14395e" stroke-width="3" stroke-linecap="round"><path d="M245,180 H415"/></g><text x="287" y="165" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#14395e">C</text><text x="330" y="138" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#14395e">A</text><text x="373" y="165" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#14395e">B</text><text x="330" y="202" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#14395e">ángulo llano = 180°</text><text x="215" y="232" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="600" fill="#14395e">A + B + C = 180°</text>

</svg>
