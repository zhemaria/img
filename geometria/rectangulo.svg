<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="300" height="250" role="img" aria-labelledby="t-rectangulo d-rectangulo">
<title id="t-rectangulo">Rectangulo</title>
<desc id="d-rectangulo">Cuadrilatero con cuatro angulos rectos, marcados con un cuadro en cada vertice. Los lados opuestos son iguales: el largo en horizontal y el ancho en vertical. Sus dos diagonales, dibujadas con linea discontinua, tienen la misma longitud, senalada con una raya en cada una.</desc>
<rect x="0" y="0" width="300" height="250" fill="#ffffff"/>
<path d="M45,60 H255 V190 H45 Z" fill="#dbe9f7" stroke="#14395e" stroke-width="3" stroke-linejoin="round"/><g fill="none" stroke="#14395e" stroke-width="3" stroke-linecap="round"><path d="M45,78 H63 V60"/><path d="M255,78 H237 V60"/><path d="M255,172 H237 V190"/><path d="M45,172 H63 V190"/></g><g fill="none" stroke="#14395e" stroke-width="2.5" stroke-dasharray="7 5"><path d="M45,60 L255,190"/><path d="M255,60 L45,190"/></g><g fill="none" stroke="#a02218" stroke-width="3" stroke-linecap="round"><path d="M104.3,105.0 L111.7,93.1"/><path d="M188.3,93.1 L195.7,105.0"/></g><text x="150" y="212" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#14395e">largo</text><text x="30" y="125" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#14395e" transform="rotate(-90 30 125)">ancho</text>
<text x="150" y="236" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#14395e">Rectángulo</text>
</svg>
