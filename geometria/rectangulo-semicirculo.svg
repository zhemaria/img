<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 262" width="280" height="262" role="img" aria-labelledby="t-rectangulo-semicirculo d-rectangulo-semicirculo">
<title id="t-rectangulo-semicirculo">Figura compuesta: rectangulo mas semicirculo</title>
<desc id="d-rectangulo-semicirculo">Figura formada por un rectangulo con un semicirculo apoyado sobre su lado superior. La linea discontinua separa las dos partes. El diametro del semicirculo coincide con la base del rectangulo, y su radio r es la mitad de esa base. El area total se obtiene sumando el area del rectangulo y la del semicirculo.</desc>
<rect x="0" y="0" width="280" height="262" fill="#ffffff"/>
<path d="M50,220 V110 A90,90 0 0 1 230,110 V220 Z" fill="#dbe9f7" stroke="#14395e" stroke-width="3" stroke-linejoin="round"/><g fill="none" stroke="#14395e" stroke-width="2.5" stroke-dasharray="7 5"><path d="M50,110 H230"/></g><g fill="none" stroke="#a02218" stroke-width="2.5" stroke-linecap="round"><path d="M140,110 H230"/></g><circle cx="140" cy="110" r="4.5" fill="#a02218"/><text x="186" y="103" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#a02218">r</text><text x="140" y="70" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#14395e">semicírculo</text><text x="140" y="175" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#14395e">rectángulo</text><text x="140" y="242" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#14395e">base</text><text x="38" y="168" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#14395e" transform="rotate(-90 38 168)">altura</text>

</svg>
