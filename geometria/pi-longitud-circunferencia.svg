<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 265" width="420" height="265" role="img" aria-labelledby="t-pi-longitud-circunferencia d-pi-longitud-circunferencia">
<title id="t-pi-longitud-circunferencia">Pi y la longitud de la circunferencia</title>
<desc id="d-pi-longitud-circunferencia">Arriba, una circunferencia con su diametro d marcado. Abajo, ese mismo diametro se repite tres veces seguidas en linea recta y sobra un trozo pequeno equivalente a 0,1416 veces el diametro. En total, la longitud de la circunferencia equivale a 3,1416 diametros.</desc>
<rect x="0" y="0" width="420" height="265" fill="#ffffff"/>
<circle cx="75" cy="80" r="55" fill="#dbe9f7" stroke="#14395e" stroke-width="3"/><g fill="none" stroke="#14395e" stroke-width="3" stroke-linecap="round"><path d="M20,80 H130"/></g><text x="75" y="72" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#14395e">d</text><path d="M30,178 H140 V192 H30 Z" fill="#dbe9f7" stroke="#14395e" stroke-width="3" stroke-linejoin="round"/><text x="85" y="214" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#14395e">d</text><path d="M140,178 H250 V192 H140 Z" fill="#dbe9f7" stroke="#14395e" stroke-width="3" stroke-linejoin="round"/><text x="195" y="214" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#14395e">d</text><path d="M250,178 H360 V192 H250 Z" fill="#dbe9f7" stroke="#14395e" stroke-width="3" stroke-linejoin="round"/><text x="305" y="214" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#14395e">d</text><path d="M360,178 H405.6 V192 H360 Z" fill="#f6e0dc" stroke="#a02218" stroke-width="3" stroke-linejoin="round"/><text x="383" y="168" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#a02218">0,1416 · d</text><text x="210" y="245" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="600" fill="#14395e">Longitud de la circunferencia = 3,1416 · d</text>

</svg>
